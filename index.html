<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>주급 계산기</title>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
    :root {
        --bg-color: #f1f5f9;
        --card-bg: white;
        --text-color: #1e293b;
        --input-border: #ddd;
        --result-bg: #f8fafc;
        --line-color: #ddd;
        --accent-color: #3b82f6;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --input-border: #334155;
            --result-bg: #334155;
            --line-color: #475569;
        }
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
        margin: 0; background: var(--bg-color); display: flex; justify-content: center; align-items: center;
        min-height: 100vh; color: var(--text-color); padding: 16px;
    }

    .container {
        width: 100%; max-width: 400px; background: var(--card-bg); padding: 24px;
        border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .lang-btns { text-align: right; margin-bottom: 10px; }
    .lang-btns button {
        border: none; padding: 6px 10px; border-radius: 10px; margin-left: 2px;
        cursor: pointer; font-weight: 600; background: var(--result-bg); color: var(--text-color); font-size: 13px;
    }
    .active { background: var(--accent-color) !important; color: white !important; }

    h1 { text-align: center; margin: 10px 0 20px 0; font-size: 24px; }

    /* 성함 및 근무 기간 입력 섹션 */
    .user-info-section {
        margin-bottom: 20px; padding: 15px;
        background: var(--result-bg); border-radius: 12px; border: 1px dashed var(--line-color);
    }
    .info-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .info-group { flex: 1; }
    .info-group label { font-size: 12px; margin-top: 0; margin-bottom: 4px; color: #64748b; display: block; text-align: center; }
    .info-group input {
        width: 100%; border: 1px solid var(--input-border); border-radius: 8px;
        padding: 8px; font-size: 14px; background: var(--card-bg); color: var(--text-color);
        outline: none; text-align: center; font-weight: 600;
    }
    /* 안내 문구 스타일 */
    .info-notice {
        font-size: 11px; color: #94a3b8; text-align: center; margin-top: 5px; font-weight: 500;
    }

    label { font-weight: 600; display: block; margin-top: 18px; margin-bottom: 8px; font-size: 15px; }

    .counter { display: flex; gap: 8px; width: 100%; align-items: center; }
    .counter input {
        flex: 1; min-width: 0; text-align: center; font-size: 24px; font-weight: 700;
        border: 1px solid var(--input-border); border-radius: 12px; height: 55px;
        background: var(--card-bg); color: var(--text-color); outline: none;
    }
    .counter button {
        width: 55px; height: 55px; flex-shrink: 0; border: none; 
        background: var(--accent-color); color: white; font-size: 24px; border-radius: 12px; cursor: pointer;
    }

    .btn-group { display: flex; gap: 8px; margin-top: 20px; }
    .btn-group button {
        flex: 1; height: 52px; border: none; border-radius: 12px; 
        color: white; font-size: 18px; cursor: pointer; font-weight: 600;
    }
    .reset { background: #ef4444; }
    .capture { background: #10b981; }

    .result-box { margin-top: 28px; padding: 20px; border-radius: 14px; background: var(--result-bg); }
    .line { display: flex; justify-content: space-between; font-size: 18px; margin-bottom: 10px; align-items: center; }
    .deduction { color: #ef4444; }
    .final {
        margin-top: 18px; padding-top: 15px; border-top: 2px dashed var(--line-color); text-align: center;
    }
    .final h2 { font-size: 32px; font-weight: 800; color: #16a34a; margin: 10px 0 5px 0; }
    .exchange-info { font-size: 15px; color: #64748b; text-align: center; margin-top: 8px; font-weight: 500; }
</style>
</head>

<body>

<div class="container" id="capture-area">
    <div class="lang-btns">
        <button onclick="setLang('ko')" id="btn-ko">한국어</button>
        <button onclick="setLang('uz')" id="btn-uz">O'zbekcha</button>
        <button onclick="setLang('zh')" id="btn-zh">中文</button>
    </div>

    <h1 id="title">주급 계산기</h1>

    <div class="user-info-section">
        <div class="info-row">
            <div class="info-group">
                <label id="label-name">성함</label>
                <input type="text" id="user-name" placeholder="...">
            </div>
            <div class="info-group">
                <label id="label-period">근무 기간</label>
                <input type="text" id="user-period" placeholder="예: 5.4~5.11">
            </div>
        </div>
        <div class="info-notice" id="label-notice">* 화면 저장 시에만 입력해 주세요 *</div>
    </div>

    <label id="label-days8">출근일수 (8시간 - 95,000원)</label>
    <div class="counter">
        <button onclick="changeValue('days8', -1)">-</button>
        <input id="days8" value="0" readonly>
        <button onclick="changeValue('days8', 1)">+</button>
    </div>

    <label id="label-days6">출근일수 (6시간 - 65,000원)</label>
    <div class="counter">
        <button onclick="changeValue('days6', -1)">-</button>
        <input id="days6" value="0" readonly>
        <button onclick="changeValue('days6', 1)">+</button>
    </div>

    <label id="label-early">조출지원 (3시간 - 51,600원)</label>
    <div class="counter">
        <button onclick="changeValue('early', -1)">-</button>
        <input id="early" value="0" readonly>
        <button onclick="changeValue('early', 1)">+</button>
    </div>

    <label id="label-support">육가공지원 (1시간-15,480원)</label>
    <div class="counter">
        <button onclick="changeValue('support', -1)">-</button>
        <input id="support" value="0" readonly>
        <button onclick="changeValue('support', 1)">+</button>
    </div>

    <label id="label-meal">식대 (일요일 8시간 근무 시 10,000원)</label>
    <div class="counter">
        <button onclick="changeValue('meal', -1)">-</button>
        <input id="meal" value="0" readonly>
        <button onclick="changeValue('meal', 1)">+</button>
    </div>

    <div class="btn-group">
        <button class="reset" onclick="resetAll()" id="reset-text">초기화</button>
        <button class="capture" onclick="captureScreen()" id="capture-text">화면 저장</button>
    </div>

    <div class="result-box">
        <div class="line">
            <span id="pretax-text">세전 합계</span>
            <strong id="gross">0원</strong>
        </div>
        <div class="line deduction">
            <span id="tax-text">공제 (3.3%)</span>
            <strong id="tax">0원</strong>
        </div>
        <div class="final">
            <p id="net-text">실수령액</p>
            <h2 id="net">0원</h2>
            <div id="ex-rate-display" class="exchange-info"></div>
        </div>
    </div>
</div>

<script>
const PAY = { days8: 95000, days6: 65000, early: 51600, support: 15480, meal: 10000 };
const TAX_RATE = 0.033;
const MAX_DAYS = 7;

let exchangeRates = { UZS: 9.3, CNY: 0.0053 }; 
let values = { days8: 0, days6: 0, early: 0, support: 0, meal: 0 };

async function fetchRates() {
    try {
        const response = await fetch('https://open.er-api.com/v6/latest/KRW');
        const data = await response.json();
        if(data && data.rates) {
            exchangeRates.UZS = data.rates.UZS;
            exchangeRates.CNY = data.rates.CNY;
            calc();
        }
    } catch (e) { console.error("환율 로드 실패", e); }
}

function changeValue(type, n){
    const newValue = values[type] + n;
    if (newValue >= 0 && newValue <= MAX_DAYS) {
        values[type] = newValue;
        document.getElementById(type).value = values[type];
        calc();
    }
}

function resetAll(){
    for(let key in values) { values[key] = 0; document.getElementById(key).value = 0; }
    document.getElementById("user-name").value = "";
    document.getElementById("user-period").value = "";
    calc();
}

function captureScreen() {
    const area = document.getElementById("capture-area");
    const name = document.getElementById("user-name").value || "근무자";
    html2canvas(area, {
        backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--bg-color'),
        scale: 2
    }).then(canvas => {
        const link = document.createElement('a');
        link.download = `주급계산_${name}.png`;
        link.href = canvas.toDataURL();
        link.click();
    });
}

function calc(){
    const gross = (values.days8 * PAY.days8) + (values.days6 * PAY.days6) + 
                  (values.early * PAY.early) + (values.support * PAY.support) + 
                  (values.meal * PAY.meal);
    const tax = Math.round(gross * TAX_RATE);
    const net = gross - tax;
    const lang = localStorage.getItem("lang") || "ko";
    
    document.getElementById("gross").innerText = gross.toLocaleString() + " 원";
    document.getElementById("tax").innerText = tax.toLocaleString() + " 원";
    document.getElementById("net").innerText = net.toLocaleString() + " 원";

    const exDisplay = document.getElementById("ex-rate-display");
    if (lang === "uz") {
        exDisplay.innerText = `≈ ${Math.round(net * exchangeRates.UZS).toLocaleString()} UZS (So'm)`;
    } else if (lang === "zh") {
        exDisplay.innerText = `≈ ${(net * exchangeRates.CNY).toFixed(2).toLocaleString()} CNY (元)`;
    } else { exDisplay.innerText = ""; }
}

const text = {
    ko:{
        title:"주급 계산기", name:"성함", period:"근무 기간", notice:"* 화면 저장 시에만 입력해 주세요 *",
        days8:"출근일수 (8시간 - 95,000원)", days6:"출근일수 (6시간 - 65,000원)",
        early:"조출지원 (3시간 - 51,600원)", support:"육가공지원 (1시간-15,480원)",
        meal:"식대 (일요일 8시간 근무 시 10,000원)", reset:"초기화", capture:"화면 저장",
        pretax:"세전 합계", tax:"공제 (3.3%)", net:"실수령액"
    },
    uz:{
        title:"Haftalik hisoblagich", name:"Ism", period:"Ish davri", notice:"* Faqat rasmga olishda to'ldiring *",
        days8:"Ish kunlari (8 soat - 95,000₩)", days6:"Ish kunlari (6 soat - 65,000₩)",
        early:"Erta ish (3 soat - 51,600₩)", support:"Go'sht ishi (1 soat - 15,480₩)",
        meal:"Ovqat puli (Yakshanba 10,000₩)", reset:"Tozalash", capture:"Saqlash",
        pretax:"Jami", tax:"Soliq (3.3%)", net:"Qo'lga tegadigan"
    },
    zh:{
        title:"周薪计算器", name:"姓名", period:"工作期间", notice:"* 仅在保存图片时填写 *",
        days8:"出勤 (8h - 95,000원)", days6:"出勤 (6h - 65,000원)",
        early:"提早出勤 (3h - 51,600원)", support:"肉类加工 (1h - 15,480원)",
        meal:"伙食费 (周日 10,000원)", reset:"重置", capture:"保存",
        pretax:"税前合计", tax:"扣除 (3.3%)", net:"实发工资"
    }
};

function setLang(lang){
    localStorage.setItem("lang", lang);
    document.querySelectorAll(".lang-btns button").forEach(b=>b.classList.remove("active"));
    document.getElementById("btn-"+lang).classList.add("active");

    document.getElementById("title").innerText=text[lang].title;
    document.getElementById("label-name").innerText=text[lang].name;
    document.getElementById("label-period").innerText=text[lang].period;
    document.getElementById("label-notice").innerText=text[lang].notice;
    document.getElementById("label-days8").innerText=text[lang].days8;
    document.getElementById("label-days6").innerText=text[lang].days6;
    document.getElementById("label-early").innerText=text[lang].early;
    document.getElementById("label-support").innerText=text[lang].support;
    document.getElementById("label-meal").innerText=text[lang].meal;
    document.getElementById("reset-text").innerText=text[lang].reset;
    document.getElementById("capture-text").innerText=text[lang].capture;
    document.getElementById("pretax-text").innerText=text[lang].pretax;
    document.getElementById("tax-text").innerText=text[lang].tax;
    document.getElementById("net-text").innerText=text[lang].net;
    calc();
}

fetchRates();
setLang(localStorage.getItem("lang") || "ko");
</script>

</body>
</html>
